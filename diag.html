<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diagnostico - musica-kids</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #14142b; color: #fff; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: rgba(255,255,255,.08); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .k { font-size: 13px; opacity: .65; }
  .v { font-size: 19px; font-weight: 700; word-break: break-all; }
  .ok { background: #14532d; }
  .mal { background: #7f1d1d; }
  .verdict { font-size: 22px; font-weight: 800; }
  .nota { font-size: 13px; opacity: .85; line-height: 1.5; margin-top: 6px; }
</style>
</head>
<body>
<h1>Diagnostico del chat de los juguetes</h1>
<div id="out">Cargando...</div>

<script>
// Debe reflejar la ventana de la conversacion activa y la ZONA del proyecto.
var VENTANA = { desde: '2026-08-03', hasta: '2026-08-03', desdeHora: '15:00', hastaHora: '21:00' };
var ZONA = 'America/Santiago';

function dd(n) { return String(n).padStart(2, '0'); }

// Misma logica que la app: se evalua en hora de Chile, no en la del aparato.
function partesEnZona(d) {
  try {
    var fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone: ZONA, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });
    var p = {};
    fmt.formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    if (p.year && p.hour) return { fecha: p.year + '-' + p.month + '-' + p.day, hora: p.hour + ':' + p.minute, zona: true };
  } catch (e) {}
  return { fecha: d.getFullYear() + '-' + dd(d.getMonth() + 1) + '-' + dd(d.getDate()),
           hora: dd(d.getHours()) + ':' + dd(d.getMinutes()), zona: false };
}

function card(k, v, clase) {
  return '<div class="card ' + (clase || '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

function pintar(base, fuenteHora) {
  var enChile = partesEnZona(base);
  var motivos = [];
  if (enChile.fecha < VENTANA.desde) motivos.push('la fecha en Chile es anterior al ' + VENTANA.desde);
  if (enChile.fecha > VENTANA.hasta) motivos.push('la fecha en Chile es posterior al ' + VENTANA.hasta);
  if (enChile.hora < VENTANA.desdeHora) motivos.push('en Chile aun no son las ' + VENTANA.desdeHora);
  if (enChile.hora > VENTANA.hastaHora) motivos.push('en Chile ya pasaron las ' + VENTANA.hastaHora);
  var dentro = motivos.length === 0;

  var aparato = dd(base.getHours()) + ':' + dd(base.getMinutes());
  var tz = 'no disponible';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}

  var html = '';
  html += card('Veredicto',
    '<span class="verdict">' + (dentro ? 'EL BOTON DEBE VERSE' : 'EL BOTON NO SE VE') + '</span>' +
    (dentro ? '' : '<div class="nota">Motivo: ' + motivos.join(' y ') + '.</div>'),
    dentro ? 'ok' : 'mal');
  html += card('Ventana (hora de Chile)', VENTANA.desde + ' de ' + VENTANA.desdeHora + ' a ' + VENTANA.hastaHora);
  html += card('Hora en Chile (la que manda)', enChile.fecha + '  ' + enChile.hora);
  html += card('Hora que marca este aparato', aparato + '  (' + tz + ')');
  html += card('De donde se saca la hora', fuenteHora);
  html += card('Conversion de zona horaria', enChile.zona ? 'soportada por el navegador' : 'NO soportada, se usa la del aparato', enChile.zona ? 'ok' : 'mal');
  html += card('Navegador', navigator.userAgent);
  document.getElementById('out').innerHTML = html;
}

// Primero con el reloj del aparato, y si el servidor responde se corrige.
pintar(new Date(), 'reloj del aparato (aun sin respuesta del servidor)');

fetch('./', { method: 'HEAD', cache: 'no-store' })
  .then(function (r) {
    var cab = r.headers.get('date');
    var t = cab ? Date.parse(cab) : NaN;
    if (isNaN(t)) { pintar(new Date(), 'reloj del aparato (el servidor no envio hora)'); return; }
    var desfase = t - Date.now();
    var seg = Math.round(desfase / 1000);
    pintar(new Date(Date.now() + desfase),
      'hora real del servidor' + (Math.abs(seg) > 60 ? ' (el reloj del aparato esta corrido ' + seg + ' segundos)' : ''));
  })
  .catch(function () { pintar(new Date(), 'reloj del aparato (fallo la consulta al servidor)'); });
</script>
</body>
</html>
